# CI — type-check, lint, test, and build the two REAL packages in this repo.
#
# HISTORY / WHY THIS LOOKS THE WAY IT DOES:
# The previous version of this file ran `npm run type-check -w shared|frontend|backend`
# — npm *workspace* invocations. This repo has never had npm workspaces or a
# "shared" package, so those steps could not succeed and CI never actually
# protected the code. This version targets the real directories directly:
#   react-webapp/frontend  (Vite + React, deployed by Vercel)
#   react-webapp/backend   (Express + TS, deployed by Railway)
# Each job installs with its own lockfile so caching is correct per package.

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read # least privilege: CI only needs to read the repo

concurrency:
  # A newer push to the same ref cancels the older in-flight run — saves
  # runner minutes and always reports on the latest code.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-webapp/frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc catches wrong props, nullable mistakes, broken interfaces, and
      # import mismatches that a bundler-only build (Vite uses esbuild, which
      # SKIPS type checking) would happily let through to production.
      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run --passWithNoTests

      - name: Build
        run: npm run build

  backend:
    name: Backend — typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-webapp/backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-webapp/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Backend tests mock Neo4j/Postgres (see src/routes/graph.test.ts), so
      # they run in CI without live databases.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
