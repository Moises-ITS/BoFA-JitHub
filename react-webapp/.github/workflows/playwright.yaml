#Does this app actually work in a browser like a user would experience it?
#Compareable to unit tests except playwright validates real flows like log in, click buttons,
# fill forms, navigate pagees, submit actions and confirm UI behavior
name: Playwright QA

on: #runs on pull and push 
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions: #only has permissions to read NOT write
  contents: read

concurrency: #only allows one of these calls at a time and if another is made then it gets canceled and most recent runs
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e: #end to end testing
    name: End-to-End Tests
    runs-on: ubuntu-latest #runs ubuntu machine
    timeout-minutes: 20 #kills task if more than 20 minutes

    steps:
      - name: Checkout repository #opens repository on machine
        uses: actions/checkout@v4

      - name: Setup Node.js #setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20 #select node version
          cache: npm #caches npm so faster to load next time

      - name: Install dependencies #installs required dependencies
        run: npm ci #replaces npm run install replacement for being faster and industry standard

      - name: Install Playwright browsers #installs playwright and dependencies for tests
        run: npx playwright install --with-deps

      - name: Build app #build app
        run: npm run build

      - name: Start app #run app
        run: npm run start &
        env:
          CI: true #sets app to be in CI environment

      - name: Wait for app to be ready #waits for app to be live if not tests fail
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Playwright tests #runs tests
        run: npx playwright test

      - name: Upload Playwright report #uploads report
        if: always() #run even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore #runs even if no files found
