# .github/workflows/ci.yml

name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            react-webapp/package-lock.json
            react-webapp/frontend/package-lock.json
            react-webapp/backend/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: react-webapp

      - name: Install frontend dependencies
        run: npm ci
        working-directory: react-webapp/frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: react-webapp/backend

      - name: Redis smoke test (when configured)
        if: ${{ vars.REDIS_URL != '' || vars.REDIS_URLS != '' || vars.REDIS_HOST != '' || secrets.REDIS_URL != '' || secrets.REDIS_URLS != '' || secrets.REDIS_HOST != '' }}
        run: npm run redis:smoke
        working-directory: react-webapp/backend
        env:
          REDIS_URL: ${{ secrets.REDIS_URL != '' && secrets.REDIS_URL || vars.REDIS_URL }}
          REDIS_URLS: ${{ secrets.REDIS_URLS != '' && secrets.REDIS_URLS || vars.REDIS_URLS }}
          REDIS_HOST: ${{ secrets.REDIS_HOST != '' && secrets.REDIS_HOST || vars.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT != '' && secrets.REDIS_PORT || vars.REDIS_PORT }}
          REDIS_DB: ${{ secrets.REDIS_DB != '' && secrets.REDIS_DB || vars.REDIS_DB }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME != '' && secrets.REDIS_USERNAME || vars.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD != '' && secrets.REDIS_PASSWORD || vars.REDIS_PASSWORD }}
          REDIS_TLS: ${{ secrets.REDIS_TLS != '' && secrets.REDIS_TLS || vars.REDIS_TLS }}
          REDIS_SSL: ${{ secrets.REDIS_SSL != '' && secrets.REDIS_SSL || vars.REDIS_SSL }}

      - name: Type check frontend
        run: npx tsc --noEmit --project tsconfig.json
        working-directory: react-webapp/frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: react-webapp/frontend

      - name: Lint backend
        run: npm run lint --if-present
        working-directory: react-webapp/backend

      - name: Build frontend
        run: npm run build
        working-directory: react-webapp/frontend

      - name: Build backend
        run: npm run build
        working-directory: react-webapp/backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            react-webapp/frontend/dist
            react-webapp/backend/dist
          if-no-files-found: error
