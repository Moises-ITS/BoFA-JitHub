#Does this app actually work in a browser like a user would experience it?
#Compareable to unit tests except playwright validates real flows like log in, click buttons,
# fill forms, navigate pagees, submit actions and confirm UI behavior
name: Playwright QA

on:
  pull_request: #runs on pull and push requests for extra protection
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions: #This file is only allowed to read contents and not edit
  contents: read

concurrency: # Lets say this code is called 3 times in a row then it will be run 3x which is wasteful, this cancels older runs and only runs new
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e: #job is a full task running on a machine, for this it would be end to end testing
    name: End-to-End Tests
    runs-on: ubuntu-latest #new computer run
    timeout-minutes: 20 #kill this job if it takes longer than 20 minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #downloads repo onto your machine

      - name: Setup Node.js #setsup node for run
        uses: actions/setup-node@v4
        with:
          node-version: 20 #node version
          cache: npm #faster installs for the next time its run after the first

      - name: Install dependencies #installs dependencies for code to run
        run: npm ci #subbed for npm install because its deterministic, faster and industry standard

      - name: Install Playwright browsers #installs chromeium, firefox and webkit and other system dependencies
        run: npx playwright install --with-deps

      - name: Build app #builds application
        run: npm run build

      - name: Start app #runs applications and & symbol means run in the background while other things process(multitasking)
        run: npm run start &
        env:
          CI: true #tells the machine its running on a CI environment which treats it differently (no prompting)

      - name: Wait for app to be ready #only run tests while server is confirmed live(important could lead to server crash)
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Playwright tests #this is the tester that goes on pages, clicks buttons, navigates UI and checks UI
        run: npx playwright test

      - name: Upload Playwright report #uploads reports for the tests 
        if: always() #means reports are always run even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report #uploads files to github
            test-results
          if-no-files-found: ignore #dont crash if files are missing
