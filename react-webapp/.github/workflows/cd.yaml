name: CD

on:
  push: #runs only on main
    branches: [main]

permissions: #permissions is set to read repo but write in packages
  contents: read
  packages: write
 
concurrency: #checks for concurrency and cancels any old processes
  group: cd-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest #runs ubuntu latest on practice environments and times out after 20 minutes
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout repository #installs repo onto ubuntu machine
        uses: actions/checkout@v4

      - name: Setup Node.js #setup node.js on VM
        uses: actions/setup-node@v4
        with:
          node-version: 20 #version
          cache: npm #caching results for faster load on second use

      - name: Install dependencies
        run: npm ci #install dependencies

      - name: Build application #builds application
        run: npm run build

      - name: Confirm Deployment #confirms deployment
        run: echo: "Main branch is validated. Connected platform will handle deployment."
        
