# Playwright E2E — runs the browser tests in react-webapp/frontend/tests/e2e.
#
# HISTORY / WHY THIS LOOKS THE WAY IT DOES:
# The previous version ran from the react-webapp/ root (which held a dead,
# since-deleted Vite scaffold), invoked an `npm run start` script that didn't
# exist there, and waited on port 3001 (the BACKEND's port) for a frontend app.
# None of those steps could ever have worked.
#
# This version leans on playwright.config.ts's `webServer` block, which starts
# the Vite dev server on 5175 and waits for it — so the workflow needs no
# manual build/start/wait choreography at all. The specs mock every backend
# call with page.route(), so no backend or database is needed either.
#
# REQUIRED SECRET: VITE_CLERK_PUBLISHABLE_KEY (a Clerk *test-instance*
# publishable key). Without it the app renders the "Missing Clerk publishable
# key" setup screen and every spec fails on its first navigation.

name: Playwright QA

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-webapp/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            react-webapp/frontend/playwright-report
            react-webapp/frontend/test-results
          if-no-files-found: ignore
