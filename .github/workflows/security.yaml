# Move to: .github/workflows/security.yaml  (repo root)

name: Security

on:
  pull_request:
    branches: [main, dev]      # FIX #2: was "develop"
  push:
    branches: [main, dev]      # FIX #2: was "develop"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-dependencies:
    name: Secrets and Dependency Scans
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-webapp/package-lock.json

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          path: ./
          base: ${{ github.event.before || '' }}
          extra_args: --debug --only-verified

      - name: GitGuardian Scan
        uses: GitGuardian/ggshield-action@v1.27.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Dependency Scan (Snyk - frontend)  # FIX #6
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          file: react-webapp/package.json

      - name: Dependency Scan (Snyk - backend)   # FIX #6 (added)
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          file: react-webapp/backend/package.json

      - name: Audit frontend npm packages         # FIX #5
        run: npm audit --audit-level=high
        working-directory: react-webapp

      - name: Audit backend npm packages          # FIX #5 (added)
        run: npm audit --audit-level=high
        working-directory: react-webapp/backend

  codeql:
    name: SAST with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:                                        # FIX #3: correct indentation
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript        # FIX #4: removed python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  gatekeeper:
    name: Gatekeeper
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secrets-and-dependencies
      - codeql
    steps:
      - name: Fail if any required security job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') }}  # FIX #8
        run: |
          echo "Security breach detected. Deployment blocked."
          exit 1
      - name: Pass when all security jobs are green
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped') }}
        run: echo "Guardian is active. Code is secure."
