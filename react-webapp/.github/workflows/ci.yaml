# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  # Least Privilege: only read access needed for CI checks
  contents: read

concurrency:
  # Cancel any in-progress run for the same branch/PR so we don't waste
  # runner minutes when multiple commits are pushed in quick succession.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # All run steps execute inside react-webapp/frontend because that is
    # where package.json, src/, and tests live. Without this, every
    # command would run from the repo root and fail to find scripts.
    working-directory: react-webapp/frontend

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Point to the lockfile inside the actual project directory,
          # not the repo root, so the cache key is computed correctly.
          cache-dependency-path: react-webapp/frontend/package-lock.json

      - name: Install dependencies
        # npm ci is preferred over npm install in CI: faster,
        # reproducible, and fails if the lockfile is out of sync.
        run: npm ci

      - name: Type check
        # Catches wrong props, bad return types, nullable mistakes,
        # broken interfaces, and import mismatches before runtime.
        run: npx tsc --noEmit

      - name: Lint
        # Catches style issues, unused variables, bad imports, and
        # dangerous patterns early in the pipeline.
        run: npm run lint

      - name: Unit Tests
        # Vitest is the test runner (confirmed in frontend/package.json).
        # --run executes tests once (non-watch mode), correct for CI.
        # --passWithNoTests prevents failing the workflow when test
        # coverage has not been built out yet.
        run: npx vitest run --passWithNoTests

      - name: Build application
        # Verifies the app can be assembled into a deployable artifact.
        # Catches unresolved imports, bundling errors, and TypeScript
        # compile failures that linting may have missed.
        run: npm run build

      - name: Upload Build Artifact
        # Stores the Vite build output (dist/) for debugging.
        # Vite outputs to dist/ by default.
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: react-webapp/frontend/dist
          if-no-files-found: ignore
